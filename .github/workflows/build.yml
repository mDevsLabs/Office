name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:all

      - name: Build macOS installer
        env:
          GENOFFICE_UPDATE_URL: ${{ vars.GENOFFICE_UPDATE_URL }}
        run: |
          cd apps/shell
          npm run dist:mac -- --config "{\"mac\":{\"notarize\":false,\"hardenedRuntime\":false},\"dmg\":{\"sign\":false}}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenOffice-macOS
          path: apps/shell/release/**
          compression-level: 0

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:all

      - name: Build Windows installer
        env:
          GENOFFICE_UPDATE_URL: ${{ vars.GENOFFICE_UPDATE_URL }}
          CSC_LINK: ''
        run: |
          cd apps/shell
          npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenOffice-Windows
          path: apps/shell/release/**
          compression-level: 0