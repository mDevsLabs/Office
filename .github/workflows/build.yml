name: Build

on:
  workflow_dispatch:
  push:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Generate third-party notices
        run: npm run notices

      - name: Build all packages
        run: npm run build:all

      - name: Build macOS installer
        env:
          GENOFFICE_UPDATE_URL: ${{ vars.GENOFFICE_UPDATE_URL }}
          CSC_LINK: ''
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_SKIP_NOTARIZE: 'true'
        run: |
          cd apps/shell
          npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mAI Office-macOS
          path: apps/shell/release/**
          compression-level: 0

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Generate third-party notices
        run: npm run notices

      - name: Build all packages
        run: npm run build:all

      - name: Build Windows installer
        env:
          GENOFFICE_UPDATE_URL: ${{ vars.GENOFFICE_UPDATE_URL }}
          CSC_LINK: ''
        run: |
          cd apps/shell
          npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mAI Office-Windows
          path: apps/shell/release/**
          compression-level: 0

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Generate third-party notices
        run: npm run notices

      - name: Build all packages
        run: npm run build:all

      - name: Build Linux installer
        env:
          GENOFFICE_UPDATE_URL: ${{ vars.GENOFFICE_UPDATE_URL }}
        run: |
          cd apps/shell
          npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mAI Office-Linux
          path: apps/shell/release/**
          compression-level: 0